services:
  volume-init:
    image: ghcr.io/stack127labs/stack127-ad-networks:${AD_NETWORKS_RELEASE_SHA:?Set the deployed main SHA}
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 128m
    cpus: "0.10"
    volumes:
      - data:/data
    entrypoint: [node, scripts/ad-networks/runtime/init-volume.mjs]
  jobs:
    image: ghcr.io/stack127labs/stack127-ad-networks:${AD_NETWORKS_RELEASE_SHA:?Set the deployed main SHA}
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cpus: "0.50"
    mem_limit: 1024m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 180s
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - data:/data
    environment:
      AD_NETWORKS_RUNTIME_ENVIRONMENT: production
      AD_NETWORK_DB_PATH: /data/ad-networks.sqlite
      AD_NETWORKS_STATE_DIRECTORY: /data/state
      AD_NETWORKS_CONCURRENCY: "4"
      # Scheduling starts only after automatic bootstrap completes.
      AD_NETWORKS_ENABLED_JOBS: ${AD_NETWORKS_ENABLED_JOBS:-}
      AD_NETWORKS_ACTIVATED_AT: ${AD_NETWORKS_ACTIVATED_AT:?Set once to activation time in ISO UTC}
      DATABASE_POOLER_URL: ${DATABASE_POOLER_URL:?Use production session-pooler credentials}
      GITHUB_ALERT_TOKEN: ${GITHUB_ALERT_TOKEN:?Use the existing issues alert token}
      SUPABASE_URL: ${SUPABASE_URL:?Use the production Storage endpoint}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Use the existing server Storage key}
      AD_NETWORKS_RELEASE_SHA: ${AD_NETWORKS_RELEASE_SHA:?Set the deployed main SHA}
      AD_NETWORKS_DEPLOYMENT_ID: ${AD_NETWORKS_DEPLOYMENT_ID:?Set the activation run ID}
    healthcheck:
      test: [CMD, node, scripts/ad-networks/scheduler.mjs, --check]
      interval: 60s
      timeout: 10s
      start_period: 30m
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  data:
    name: stack127-ad-networks-data
