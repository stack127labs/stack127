# Only OS postgres can use the local superuser socket without a password.
local all supabase_admin peer map=stack127_admin
local all all peer map=supabase_map
# Only the app and migration owner can enter from the tailnet.
# The bootstrap superuser remains on the local Unix socket.
host postgres stack127_app,postgres 100.64.0.0/10 scram-sha-256
host all all 100.64.0.0/10 reject
# Docker overlay port forwarding may report a bridge gateway as the client.
# Enforce the same role allowlist on every private TCP path, so SNAT cannot
# admit platform roles or the bootstrap superuser. Administer that user by socket.
# Docker publishes loopback and the exact tailnet IP; the overlay is private.
host all all 127.0.0.1/32 scram-sha-256
host all all ::1/128 scram-sha-256
host postgres stack127_app,postgres 10.0.0.0/8 scram-sha-256
host postgres stack127_app,postgres 172.16.0.0/12 scram-sha-256
host postgres stack127_app,postgres 192.168.0.0/16 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
