# Keep Supabase's extension paths and role-management settings.
include = '/etc/postgresql/postgresql.conf'
hba_file = '/etc/stack127/pg_hba.conf'
ident_file = '/etc/stack127/pg_ident.conf'
listen_addresses = '*'
port = 5432
ssl = on
ssl_cert_file = '/etc/stack127/tls/fullchain.pem'
ssl_key_file = '/etc/stack127/tls/privkey.pem'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'
max_connections = 60
superuser_reserved_connections = 5
shared_buffers = '512MB'
effective_cache_size = '1536MB'
work_mem = '4MB'
hash_mem_multiplier = 1.0
maintenance_work_mem = '128MB'
autovacuum_work_mem = '64MB'
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1
max_worker_processes = 12
wal_level = logical
max_wal_senders = 5
max_replication_slots = 5
max_slot_wal_keep_size = '1GB'
min_wal_size = '256MB'
max_wal_size = '1GB'
checkpoint_completion_target = 0.9
fsync = on
synchronous_commit = on
full_page_writes = on
idle_in_transaction_session_timeout = '5min'
temp_file_limit = '1GB'
timezone = 'UTC'
log_timezone = 'UTC'
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %u@%d '
log_connections = off
log_disconnections = off
log_statement = 'none'
# Do not log SQL or bind values that can contain migrated credentials.
log_min_error_statement = 'panic'
log_parameter_max_length_on_error = 0
# Restore cron jobs and HTTP queues without executing them before cutover.
cron.database_name = 'postgres'
cron.launch_active_jobs = off
shared_preload_libraries = 'pg_stat_statements,pgaudit,plpgsql,plpgsql_check,pg_cron,pgsodium,auto_explain,pg_tle,plan_filter,supabase_vault'
