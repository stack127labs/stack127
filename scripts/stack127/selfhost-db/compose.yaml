name: stack127-db
services:
  postgres:
    image: supabase/postgres:17.6.1.178@sha256:49c938c7918f1543618b60568f5a995e52d98f19883075a14f89643e8b1571fe
    container_name: stack127-db
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: 2g
    mem_reservation: 512m
    shm_size: 512m
    cpus: 2
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in the protected .env}
      POSTGRES_DB: postgres
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256 --auth-local=peer
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      STACK127_APP_PASSWORD: ${STACK127_APP_PASSWORD:?set in the protected .env}
    command: [postgres, -c, config_file=/etc/stack127/postgresql.conf]
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-config:/etc/postgresql-custom
      - ./postgresql.conf:/etc/stack127/postgresql.conf:ro
      - ./pg_hba.conf:/etc/stack127/pg_hba.conf:ro
      - ./pg_ident.conf:/etc/stack127/pg_ident.conf:ro
      - ./bootstrap.sql:/etc/postgresql.schema.sql:ro
    networks:
      database:
        aliases: [stack127-db]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -p, '5432', -U, supabase_admin, -d, postgres]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  postgres-data:
    name: stack127-db-data
  postgres-config:
    external: true
    name: stack127-db-config
networks:
  database:
    external: true
    name: stack127-db-private
