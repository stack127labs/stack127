<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App data plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101010; --panel:#171717; --panel2:#1e1e1e; --line:#2a2a2a; --line2:#383838;
  --text:#ececec; --muted:#9a9a9a; --dim:#6d6d6d; --accent:#bafc3c; --accent-ink:#101010;
  --c-ok:#bafc3c; --c-na:#4a4a4a; --c-np:#e3b341; --c-unclear:#f0883e; --c-conf:#d2793a; --c-fail:#f05d5d;
  --p-H:#bafc3c; --p-L:#7cc4ff; --p-S:#c9a7ff; --p-D:#8f8f8f; --p-K:#5a5a5a; --p-Z:#f05d5d;
  --radius:2px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f6f3; --panel:#ffffff; --panel2:#f0f0ec; --line:#e2e2dc; --line2:#d0d0c8;
    --text:#161616; --muted:#5c5c5c; --dim:#8a8a8a; --accent:#5c8a00; --accent-ink:#ffffff;
    --c-ok:#7fb800; --c-na:#c9c9c2; --c-np:#d39b12; --c-unclear:#e0711d; --c-conf:#b85f22; --c-fail:#d93b3b;
    --p-H:#6ea300; --p-L:#2a7fd0; --p-S:#7b52d1; --p-D:#8a8a8a; --p-K:#b5b5ad; --p-Z:#d93b3b;
  }
}
:root[data-theme="light"]{
    --bg:#f6f6f3; --panel:#ffffff; --panel2:#f0f0ec; --line:#e2e2dc; --line2:#d0d0c8;
    --text:#161616; --muted:#5c5c5c; --dim:#8a8a8a; --accent:#5c8a00; --accent-ink:#ffffff;
    --c-ok:#7fb800; --c-na:#c9c9c2; --c-np:#d39b12; --c-unclear:#e0711d; --c-conf:#b85f22; --c-fail:#d93b3b;
    --p-H:#6ea300; --p-L:#2a7fd0; --p-S:#7b52d1; --p-D:#8a8a8a; --p-K:#b5b5ad; --p-Z:#d93b3b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:32px 16px 80px}
header.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
header.top h1{font-size:34px}
header.top p{color:var(--muted);max-width:720px;margin:8px 0 0}
.toggle{border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:6px 10px;border-radius:var(--radius);cursor:pointer;font:inherit;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:22px 0 0;font-size:13px;color:var(--muted)}
.legend b{color:var(--text);font-weight:600;margin-right:4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:1px;margin-right:6px;vertical-align:-1px}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}

/* overview */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:26px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.card:hover{border-color:var(--line2)}
.card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card h3{font-size:17px}
.card .sub{color:var(--muted);font-size:13px;margin-top:2px}
.pbar{display:flex;height:8px;margin:12px 0 8px;gap:2px}
.pbar i{display:block;height:100%}
.card .counts{font-size:12px;color:var(--muted);line-height:1.7}
.card .counts span{display:inline-block;margin-right:8px}
.card .fixn{font-size:12px;margin-top:6px;color:var(--c-np)}

.common{margin-top:18px;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:16px 18px}
.common h2{font-size:17px;margin-bottom:6px}
.common ol{margin:6px 0 0;padding-left:20px;color:var(--text)}
.common li{margin:4px 0}

/* section */
.dir{margin-top:36px}
.dirhead h2{font-size:28px}
.dirhead .meta{display:grid;grid-template-columns:120px 1fr;gap:4px 14px;margin-top:12px;font-size:14px}
.dirhead .meta dt{color:var(--muted)}
.dirhead .meta dd{margin:0}
.step{margin-top:30px}
.step>h3{font-size:19px;display:flex;align-items:baseline;gap:10px}
.step>h3 .num{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--accent);font-weight:500}
.step>p.lead{color:var(--muted);margin:4px 0 12px;font-size:14px}

/* list row anatomy */
.anat{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow-x:auto}
.anat table{border-collapse:collapse;width:100%;min-width:760px}
.anat th{font:500 12px/1.3 Inter,sans-serif;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:bottom;white-space:nowrap}
.anat td{padding:12px;vertical-align:top;font-size:13px;border-bottom:1px solid var(--line)}
.anat tr:last-child td{border-bottom:0}
.anat .appname{font-weight:600;font-size:14px}
.anat .ph{color:var(--dim);font-size:12px}
.anat .tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--line2);border-radius:var(--radius);color:var(--muted);margin-top:4px}
.anat th .fid{font-family:"IBM Plex Mono",monospace;color:var(--dim);font-size:11px;display:block;margin-top:2px}
.anat .cov td{padding:6px 12px 10px;border-bottom:0}
.hl{color:var(--p-H)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.filters .lbl{font-size:13px;color:var(--muted);margin-right:4px}
.chip{font-size:12px;padding:3px 8px;border:1px solid var(--line2);border-radius:var(--radius);background:var(--panel2)}
.chip .fid{color:var(--dim);font-family:"IBM Plex Mono",monospace;font-size:11px;margin-left:4px}

/* detail sections */
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.sec h4{font:600 15px/1.3 "Space Grotesk",sans-serif;margin:0 0 8px;display:flex;justify-content:space-between}
.sec h4 span{font:400 12px Inter,sans-serif;color:var(--muted)}
.frow{display:grid;grid-template-columns:1fr 92px 36px;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.frow:first-of-type{border-top:0}
.frow .nm{min-width:0}
.frow .nm .fid{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);margin-right:6px}
.frow .pct{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);text-align:right}
.frow .note{grid-column:1/-1;font-size:12px;color:var(--c-np);margin:-2px 0 2px}
.flt{font-size:10px;color:var(--p-L);border:1px solid var(--p-L);border-radius:var(--radius);padding:0 4px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.bar{display:flex;height:8px;background:var(--panel2);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%}
.bar.big{height:10px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:800px){.two{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.box h4{font:600 15px/1.3 "Space Grotesk",sans-serif;margin:0 0 6px}
.box ul{margin:0;padding:0;list-style:none}
.box li{padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.box li:first-child{border-top:0}
.box li .why{display:block;color:var(--muted);font-size:12px}
.box .empty{color:var(--dim);font-size:13px}

.fixes{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c-np);border-radius:var(--radius);padding:12px 18px}
.fixes ol{margin:0;padding-left:20px}
.fixes li{margin:6px 0;font-size:14px}

details.all{margin-top:30px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
details.all summary{cursor:pointer;padding:12px 14px;font-weight:600}
.ft{width:100%;border-collapse:collapse;font-size:13px}
.ft th,.ft td{padding:6px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.ft th{color:var(--muted);font-weight:500;font-size:12px}
.ft td.n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);white-space:nowrap}
.pl{font-size:11px;padding:1px 6px;border-radius:var(--radius);white-space:nowrap;border:1px solid currentColor}
.tablewrap{overflow-x:auto}
@media (max-width:640px){
  header.top h1{font-size:26px}
  .dirhead .meta{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr 70px 34px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>App data plan</h1>
      <p id="intro"></p>
    </div>
    <button class="toggle" id="theme">Light / dark</button>
  </header>

  <div class="legend">
    <div class="lg"><b>Where it goes</b>
      <span><i class="sw" style="background:var(--p-H)"></i>Headline cost</span>
      <span><i class="sw" style="background:var(--p-L)"></i>List column</span>
      <span><i class="sw" style="background:var(--p-S)"></i>Status badge</span>
      <span><i class="sw" style="background:var(--p-D)"></i>Detail panel</span>
      <span><i class="sw" style="background:var(--p-K)"></i>Kept, not shown</span>
      <span><i class="sw" style="background:var(--p-Z)"></i>Drop</span>
    </div>
    <div class="lg"><b>Bars: what the files say</b>
      <span><i class="sw" style="background:var(--c-ok)"></i>Confirmed</span>
      <span><i class="sw" style="background:var(--c-na)"></i>Not applicable</span>
      <span><i class="sw" style="background:var(--c-np)"></i>Vendor doesn't say</span>
      <span><i class="sw" style="background:var(--c-unclear)"></i>Unclear or conflicting</span>
      <span><i class="sw" style="background:var(--c-fail)"></i>Couldn't check</span>
    </div>
  </div>

  <div class="grid" id="overview"></div>

  <div class="common">
    <h2>Fix on every page first</h2>
    <ol id="common"></ol>
  </div>

  <div id="dir" class="dir"></div>
</div>

onfirmed": 83, "not_applicable": 0, "not_published": 0, "unclear": 0, "conflicting": 0, "check_failed": 1}, "note": ""}], "fixes": ["Business (SSO) cost (F13): only 45% confirmed. This is the main reason to visit the page, so recheck Clerk, Auth0, WorkOS, Stytch, Kinde and others.", "Auth0 and Stytch at 50,000 and 100,000 users are \"Unknown\"; ZITADEL at 100,000 is \"Quote\". Keep these honest, but check once more.", "4 apps are \"check again\": Tesseral, SSOReady, Zalter and Hybridauth."]}], "common": ["Short values for the list. Every list column and filter needs one short fixed value (Yes / No / Optional, a type name, a number). Today the files hold long sentences, so the page can’t filter on them yet.", "One fixed format for headline costs. One row per usage level, with the same label in every file, so the page reads the numbers instead of an agent working them out.", "One fixed label per field. Some files use their own field names, which makes the data hard to load."], "total": 1072};
const SECS = {D1:'Price and limits',D2:'Who can use it',D3:'What it does',D4:'Your data and leaving',D5:'Company and history'};
const PLACE = {H:'Headline cost',L:'List column',S:'Status badge',D1:'Detail',D2:'Detail',D3:'Detail',D4:'Detail',D5:'Detail',K:'Kept, not shown',Z:'Drop'};
const PCOL = {H:'--p-H',L:'--p-L',S:'--p-S',K:'--p-K',Z:'--p-Z'};
const pc = p => `var(${PCOL[p]||'--p-D'})`;
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('en-US');

function shares(r){
  const t = Object.values(r).reduce((a,b)=>a+b,0)||1;
  return {t, ok:r.confirmed/t, na:r.not_applicable/t, np:r.not_published/t, un:(r.unclear+r.conflicting)/t, fail:r.check_failed/t};
}
function bar(f, big){
  const s = shares(f.rows);
  const seg = (v,c)=> v>0 ? `<i style="width:${(v*100).toFixed(1)}%;background:var(${c})"></i>` : '';
  const tip = `${f.id}: ${fmt(s.t)} values in ${f.apps} apps. Confirmed ${Math.round(s.ok*100)}%, not applicable ${Math.round(s.na*100)}%, vendor doesn't say ${Math.round(s.np*100)}%, unclear or conflicting ${Math.round(s.un*100)}%, couldn't check ${Math.round(s.fail*100)}%`;
  return `<div class="bar${big?' big':''}" title="${esc(tip)}">${seg(s.ok,'--c-ok')}${seg(s.na,'--c-na')}${seg(s.np,'--c-np')}${seg(s.un,'--c-unclear')}${seg(s.fail,'--c-fail')}</div>`;
}
const okpct = f => { const s=shares(f.rows); return Math.round((s.ok+s.na)*100); };
const isDetail = p => p[0]==='D';

const totalFields = DATA.dirs.reduce((a,d)=>a+d.fields.length,0);
document.getElementById('intro').innerHTML =
  `What we keep for each app on each page. The research holds 33 to 50 facts per app (<b>${totalFields}</b> across the 8 sub-directories) for <b>${fmt(DATA.total)}</b> apps. This plan picks the few that go in the list, groups the rest into the detail panel, and names what to drop. Each bar shows what the research files actually hold for that fact.`;
document.getElementById('common').innerHTML = DATA.common.map(x=>`<li>${esc(x)}</li>`).join('');

function counts(d){
  const c={H:0,L:0,S:0,D:0,K:0,Z:0,f:0};
  d.fields.forEach(f=>{ c[isDetail(f.place)?'D':f.place]++; if(f.filter) c.f++; });
  return c;
}
function overview(active){
  document.getElementById('overview').innerHTML = DATA.dirs.map(d=>{
    const c=counts(d), n=d.fields.length;
    const seg=(k,v)=> v? `<i style="flex:${v};background:${pc(k==='D'?'D1':k)}"></i>`:'';
    return `<button class="card${d.key===active?' on':''}" data-k="${d.key}">
      <h3>${esc(d.title)}</h3>
      <div class="sub">${fmt(d.n)} apps researched · ${n} facts each</div>
      <div class="pbar">${seg('H',c.H)}${seg('L',c.L)}${seg('S',c.S)}${seg('D',c.D)}${seg('K',c.K)}${seg('Z',c.Z)}</div>
      <div class="counts"><span>${c.H+c.L+c.S} in the list</span><span>${c.D} in detail</span><span>${c.K} kept</span><span>${c.Z} drop</span><span>${c.f} filters</span></div>
      <div class="fixn">${d.fixes.length} data fixes</div>
    </button>`;
  }).join('');
  document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{show(b.dataset.k); document.getElementById('dir').scrollIntoView({behavior:'smooth'});});
}

function show(key){
  const d = DATA.dirs.find(x=>x.key===key);
  overview(key);
  try{ history.replaceState(null,'','#'+key); }catch(e){}
  const by = p => d.fields.filter(f=>f.place===p);
  const H=by('H'), L=by('L'), S=by('S'), K=by('K'), Z=by('Z');
  const listCols = [...L];

  // list row anatomy
  const th = f => `<th style="color:${pc(f.place)}">${esc(f.label)}<span class="fid">${f.id}</span></th>`;
  const anat = `
  <div class="anat"><table>
    <thead><tr>
      <th>App<span class="fid">name · one line · status badge${S.length?' ('+S.map(s=>s.id).join(', ')+')':''} from status-changes.md</span></th>
      ${listCols.map(th).join('')}
      ${H.map(th).join('')}
    </tr></thead>
    <tbody>
      <tr>
        <td><div class="appname">App name</div><div class="ph">One line on what it does</div><span class="tag">New owner · 2026-11-05</span></td>
        ${listCols.map(f=>`<td><span class="ph">short value</span></td>`).join('')}
        ${H.map(f=>`<td class="mono hl">$0.00<div class="ph" style="font-family:Inter">plan · at chosen size</div></td>`).join('')}
      </tr>
      <tr class="cov">
        <td><span class="ph">How full the data is</span>${S.map(f=>bar(f)).join('')}</td>
        ${listCols.map(f=>`<td>${bar(f)}<div class="ph mono">${okpct(f)}% ok</div></td>`).join('')}
        ${H.map(f=>`<td>${bar(f)}<div class="ph mono">${okpct(f)}% ok</div></td>`).join('')}
      </tr>
    </tbody>
  </table></div>
  <div class="filters"><span class="lbl">Sidebar filters:</span>${d.fields.filter(f=>f.filter).map(f=>`<span class="chip">${esc(f.label)}<span class="fid">${f.id}</span></span>`).join('')}</div>
  ${[...H,...L,...S].filter(f=>f.note).map(f=>`<p class="ph" style="margin:8px 0 0;color:var(--c-np);font-size:13px"><span class="mono">${f.id}</span> ${esc(f.note)}</p>`).join('')}
  `;

  // detail sections
  const secs = Object.entries(SECS).map(([k,t])=>{
    const fs = d.fields.filter(f=>f.place===k);
    return `<div class="sec"><h4>${t}<span>${fs.length} facts</span></h4>
      ${fs.map(f=>`<div class="frow" title="${esc(f.means)}">
        <div class="nm"><span class="fid">${f.id}</span>${esc(f.label)}${f.filter?'<span class="flt">filter</span>':''}</div>
        ${bar(f)}<div class="pct">${okpct(f)}%</div>
        ${f.note?`<div class="note">${esc(f.note)}</div>`:''}
      </div>`).join('')}
    </div>`;
  }).join('');

  const li = f => `<li><span class="mono" style="color:var(--dim);font-size:11px;margin-right:6px">${f.id}</span>${esc(f.label)}<span class="why">${esc(f.note|| (f.place==='K'?'Used by the page or by us, not shown as its own fact.':''))}</span></li>`;

  const table = `<details class="all"><summary>All ${d.fields.length} facts with their full research names</summary>
    <div class="tablewrap"><table class="ft"><thead><tr><th>ID</th><th>Shown as</th><th>Research name</th><th>Goes in</th><th>Apps</th><th>Values</th><th style="min-width:120px">Data</th></tr></thead><tbody>
    ${d.fields.map(f=>{const s=shares(f.rows); return `<tr><td class="n">${f.id}</td><td>${esc(f.label)}${f.filter?'<span class="flt">filter</span>':''}</td><td style="color:var(--muted)">${esc(f.name)}</td>
      <td><span class="pl" style="color:${pc(f.place)}">${isDetail(f.place)?SECS[f.place]:PLACE[f.place]}</span></td>
      <td class="n">${f.apps}/${d.n}</td><td class="n">${fmt(s.t)}</td><td>${bar(f)}<div class="n" style="margin-top:2px">${Math.round(s.ok*100)}% confirmed</div></td></tr>`}).join('')}
    </tbody></table></div></details>`;

  document.getElementById('dir').innerHTML = `
    <div class="dirhead"><h2>${esc(d.title)}</h2>
      <dl class="meta"><dt>Jobs (tabs)</dt><dd>${esc(d.jobs)}</dd><dt>Headline cost</dt><dd>${esc(d.headline)}</dd><dt>Researched</dt><dd>${fmt(d.n)} apps, ${d.fields.length} facts each</dd></dl>
    </div>
    <div class="step"><h3><span class="num">01</span>In the list (one row per app)</h3>
      <p class="lead">${H.length+L.length+S.length} facts. Each column needs one short value. The bars show how full each one is today.</p>${anat}</div>
    <div class="step"><h3><span class="num">02</span>In the detail panel</h3>
      <p class="lead">Opens when you click an app. Every fact shows its value, a source link and the date we checked. "Vendor doesn't say" is shown openly. Hover a row to see what the fact means.</p>
      <div class="secs">${secs}</div></div>
    <div class="step"><h3><span class="num">03</span>Not shown on the page</h3>
      <div class="two">
        <div class="box"><h4>Kept, not shown (${K.length})</h4>${K.length?`<ul>${K.map(li).join('')}</ul>`:'<div class="empty">None</div>'}</div>
        <div class="box"><h4>Drop (${Z.length})</h4>${Z.length?`<ul>${Z.map(li).join('')}</ul>`:'<div class="empty">None. Every fact is worth keeping.</div>'}</div>
      </div></div>
    <div class="step"><h3><span class="num">04</span>Fix the data first</h3>
      <div class="fixes"><ol>${d.fixes.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div></div>
    ${table}
  `;
}

const start = (location.hash||'').slice(1);
show(DATA.dirs.some(d=>d.key===start)?start:'email-and-newsletters');

const root=document.documentElement;
document.getElementById('theme').onclick=()=>{
  const dark = root.dataset.theme ? root.dataset.theme==='dark' : !matchMedia('(prefers-color-scheme: light)').matches;
  root.dataset.theme = dark?'light':'dark';
};
</script>
</body>
</html>
