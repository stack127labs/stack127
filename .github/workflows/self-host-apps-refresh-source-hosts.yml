name: Refresh GitLab and Codeberg facts

on:
  workflow_dispatch:
  schedule:
    - cron: "36 5 * * *"

permissions:
  contents: read

concurrency:
  group: self-host-apps-refresh-source-hosts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_POOLER_URL }}
      GITLAB_TOKEN: ${{ secrets.STACK127_GITLAB_TOKEN }}
      CODEBERG_TOKEN: ${{ secrets.STACK127_CODEBERG_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Connect to the production database network
        if: vars.STACK127_DB_PRIVATE_NETWORK == 'tailscale'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Refresh GitLab facts
        run: npm run self-host-apps:refresh-gitlab -- --published-only --limit 500 --max-age-hours 24
      - name: Refresh Codeberg facts
        run: npm run self-host-apps:refresh-codeberg -- --published-only --limit 500 --max-age-hours 24
