name: Build ad-network jobs runtime
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed main commit to package
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: ad-networks-runtime-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Check released commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/ad-networks/runtime/Dockerfile
          push: true
          tags: ghcr.io/stack127labs/stack127-ad-networks:${{ inputs.release_sha }}
          labels: org.opencontainers.image.revision=${{ inputs.release_sha }}
          cache-from: type=gha,scope=ad-networks-runtime
          cache-to: type=gha,mode=max,scope=ad-networks-runtime
