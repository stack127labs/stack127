name: Version127 Release E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact origin/main SHA to release (leave empty for the current default branch)."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: version127-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    steps:
      - name: Checkout the requested release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Verify the release is the current origin/main tip
        id: release
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${{ inputs.commit_sha || github.sha }}"
          origin_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$origin_sha" ] || [ "$expected_sha" != "$origin_sha" ]; then
            echo "Refusing to deploy a stale or non-main revision."
            echo "expected=$expected_sha origin/main=$origin_sha"
            exit 1
          fi
          echo "sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare production quality and deployment environments
        env:
          DATABASE_URL: ${{ secrets.DATABASE_POOLER_URL || secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$DATABASE_URL" || { echo "Missing production GitHub Environment secret: DATABASE_POOLER_URL or DATABASE_URL"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing production GitHub Environment secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ZONE_ID" || { echo "Missing production GitHub Environment variable/secret: CLOUDFLARE_ZONE_ID"; exit 1; }
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY"
          } > .env.database
          node - <<'NODE' > "$RUNNER_TEMP/version127-deploy.env"
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("scripts/version127/deployment/targets.json", "utf8"));
          const production = manifest.production;
          const values = {
            VERSION127_PRODUCTION_TARGET: production.id,
            VERSION127_PRODUCTION_PROVIDER: production.provider,
            VERSION127_PRODUCTION_HOST: production.origin.ipv4,
            VERSION127_PRODUCTION_IPV6: production.origin.ipv6,
            VERSION127_PRODUCTION_SSH_USER: production.ssh.user,
            VERSION127_PRODUCTION_DOKPLOY_URL: production.dokploy.url,
            VERSION127_PRODUCTION_DOKPLOY_APP_ID: production.dokploy.applicationId,
            VERSION127_PRODUCTION_DOKPLOY_APP_NAME: production.dokploy.appName,
            VERSION127_PRODUCTION_REPOSITORY: production.repository.fullName,
            VERSION127_PRODUCTION_BRANCH: production.repository.branch,
          };
          for (const [key, value] of Object.entries(values)) console.log(`${key}=${value}`);
          NODE
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN" >> "$RUNNER_TEMP/version127-deploy.env"
          printf 'CLOUDFLARE_ZONE_ID=%s\n' "$CLOUDFLARE_ZONE_ID" >> "$RUNNER_TEMP/version127-deploy.env"

      - name: Run the complete quality gate
        run: |
          npx playwright install --with-deps chromium
          npm run quality

      - name: Run the production target preflight
        run: npm run version127:deploy:preflight -- --env-file "$RUNNER_TEMP/version127-deploy.env"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/version127-web" >> "$GITHUB_OUTPUT"

      - name: Build and push the immutable production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.release.outputs.sha }}
            ${{ steps.image.outputs.image }}:production
          build-args: |
            VERSION127_BUILD_SHA=${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=version127-production-web
          cache-to: type=gha,mode=min,scope=version127-production-web

      - name: Deploy the immutable image through Dokploy API
        env:
          DOKPLOY_API_URL: ${{ vars.VERSION127_DOKPLOY_API_URL || 'https://dokploy.version127.com' }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ vars.VERSION127_DOKPLOY_APPLICATION_ID || '_oKhy4YdVBc513i_qjVHC' }}
          DOKPLOY_DOCKER_IMAGE: ${{ steps.image.outputs.image }}:${{ steps.release.outputs.sha }}
          GHCR_DOKPLOY_USERNAME: ${{ vars.GHCR_DOKPLOY_USERNAME || github.repository_owner }}
          GHCR_DOKPLOY_TOKEN: ${{ secrets.GHCR_DOKPLOY_TOKEN }}
          VERSION127_SITE_URL: ${{ vars.VERSION127_SITE_URL || 'https://version127.com' }}
          VERSION127_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/version127/deployment/dokploy-release.mjs release
