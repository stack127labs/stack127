name: Stack127 CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "content_docs/**"
      - "skills/**"
      - "stack127_docs/**"
      - "stack127_records/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack127-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:core
      - name: Check page publishing and recovery
        run: npm run test:focused -- tests/stack127/page-publishing.test.mjs tests/stack127/page-publishing-database.test.mjs

  verify-production-build:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_POOLER_URL || secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Save checked build manifests
        uses: actions/upload-artifact@v4
        with:
          name: stack127-build-manifests-${{ github.sha }}
          path: |
            .next/app-path-routes-manifest.json
            .next/prerender-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
