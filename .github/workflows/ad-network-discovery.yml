name: Preview ad network publisher discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ad-network-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Preview candidates without database writes
        run: npm run ad-networks:discover -- --store postgres --kind sellers-json
