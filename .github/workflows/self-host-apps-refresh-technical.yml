name: Collect self-host app technical evidence

on:
  workflow_dispatch:
    inputs:
      refresh_all:
        description: "Check every published self-host app"
        default: true
        required: false
        type: boolean
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: self-host-apps-refresh-technical
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_POOLER_URL }}
      GITHUB_TOKEN: ${{ secrets.STACK127_GITHUB_TOKEN || github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Connect to the production database network
        if: vars.STACK127_DB_PRIVATE_NETWORK == 'tailscale'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Collect primary technical evidence
        run: >-
          npm run self-host-apps:refresh-primary-technical-facts --
          ${{ (github.event_name == 'schedule' || inputs.refresh_all == true) && '--refresh-all' || '' }}
          --concurrency 16
          --out scripts/self-host-apps/batches/${{ github.run_id }}-technical-refresh.json
      - name: Inspect install destinations
        if: always()
        run: npm run self-host-apps:refresh-install-options -- --limit 5000
      - name: Run publication quality gate
        if: always()
        run: npm run self-host-apps:qa-gate -- --limit 5000 --out scripts/self-host-apps/batches/${{ github.run_id }}-technical-qa-gate.json
      - name: Upload technical reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-host-app-technical-refresh-${{ github.run_id }}
          path: |
            scripts/self-host-apps/batches/${{ github.run_id }}-technical-refresh.json
            scripts/self-host-apps/batches/${{ github.run_id }}-technical-qa-gate.json
          if-no-files-found: ignore
